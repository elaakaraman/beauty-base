<!DOCTYPE html><html lang="tr"><head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0"><title>BeautyBase | Premium Beauty</title>

<link rel="stylesheet" href="style.css">

</head><body><!-- ÜST MENÜ -->
<header>

    <div class="logo">
        BEAUTY<span>BASE</span>
    </div>

    <nav>
        <a href="#">Ana Sayfa</a>
        <a href="#urunler">Ürünler</a>
        <a href="#kategoriler">Kategoriler</a>
    </nav>

    <div class="arama">
        <input
            type="text"
            id="aramaInput"
            placeholder="Ürün ara..."
        >

        <button onclick="urunAra()">Ara</button>
    </div>

</header>


<!-- ANA BAŞLIK -->
<section class="hero">

    <p>BEAUTYBASE COLLECTION</p>

    <h1>
        Güzelliğin<br>
        <span>yeni yorumu.</span>
    </h1>

    <p class="hero-aciklama">
        Makyaj, cilt bakımı ve güzellik dünyasının
        seçkin ürünlerini keşfet.
    </p>

    <a href="#urunler" class="kesfet">
        ÜRÜNLERİ KEŞFET
    </a>

</section>


<!-- KATEGORİLER -->
<section id="kategoriler" class="kategori-section">

    <h2>Kategoriler</h2>

    <div class="kategoriler">

        <button onclick="kategoriFiltrele('Makyaj')">
            Makyaj
        </button>

        <button onclick="kategoriFiltrele('Cilt Bakımı')">
            Cilt Bakımı
        </button>

        <button onclick="kategoriFiltrele('Parfüm')">
            Parfüm
        </button>

        <button onclick="tumUrunleriGoster()">
            Tüm Ürünler
        </button>

    </div>

</section>


<!-- ÜRÜNLER -->
<main id="urunler">

    <div class="baslik">

        <div>
            <p>BEAUTYBASE</p>
            <h2>Öne Çıkan Ürünler</h2>
        </div>

        <span id="urunSayisi"></span>

    </div>


    <div id="urunlerContainer" class="urunler-container">
    </div>

</main>


<!-- DETAY PENCERESİ -->
<div id="detayModal" class="modal">

    <div class="modal-content">

        <button class="kapat" onclick="detayKapat()">
            ×
        </button>

        <div id="detayIcerik"></div>

    </div>

</div>


<footer>

    <div class="logo">
        BEAUTY<span>BASE</span>
    </div>

    <p>
        Premium beauty experience.
    </p>

    <p class="copyright">
        © 2026 BeautyBase
    </p>

</footer>


<script src="script.js"></script>

</body></html>
